<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e879a8">
<title>Lucaslei</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--pink:#e879a8;--pink-dark:#c95080;--pink-light:#fdf2f7;--orange:#f08030;--green:#67c23a;--red:#f56c6c;--bg:#faf5f7;--card:#fff;--text:#333;--text2:#888;--border:#f0e0e8;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;padding-bottom:60px}

/* Header */
.header{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:700}
.header p{font-size:11px;opacity:.75;margin-top:2px}

/* Nav Tabs */
.nav-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-tab.active{color:var(--pink);border-bottom-color:var(--pink);font-weight:600}
.nav-tab .nav-icon{font-size:20px}

/* Page Container */
.page{display:none;padding:10px 12px;min-height:calc(100vh - 120px)}
.page.active{display:block}

/* Loading */
.loading{display:flex;justify-content:center;align-items:center;padding:40px;color:var(--text2);font-size:14px}
.loading::after{content:'';width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .6s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);color:#fff;max-width:90%;text-align:center}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.info{background:var(--pink)}

/* Iframe for modules */
.module-frame{width:100%;border:none;min-height:calc(100vh - 120px)}

/* Footer */
.footer{text-align:center;padding:14px;font-size:11px;color:#bbb;position:fixed;bottom:0;left:0;right:0;background:var(--bg)}

/* Responsive */
@media(max-width:767px){
  .nav-tab{font-size:12px;padding:10px 4px}
  .nav-tab .nav-icon{font-size:18px}
}
</style>
</head>
<body>

<div class="header">
  <div><h1>🏠 Lucaslei</h1><p>统一管理 · 数据同步</p></div>
</div>

<div class="nav-tabs">
  <div class="nav-tab active" data-page="recipes" onclick="switchPage('recipes')">
    <span class="nav-icon">🍳</span>
    <span>菜谱</span>
  </div>
  <div class="nav-tab" data-page="purchase" onclick="switchPage('purchase')">
    <span class="nav-icon">🛒</span>
    <span>采购</span>
  </div>
  <div class="nav-tab" data-page="weight" onclick="switchPage('weight')">
    <span class="nav-icon">⚖️</span>
    <span>体重</span>
  </div>
  <div class="nav-tab" data-page="todo" onclick="switchPage('todo')">
    <span class="nav-icon">📋</span>
    <span>待办</span>
  </div>
</div>

<div id="page-recipes" class="page active">
  <div class="loading">加载菜谱中...</div>
</div>

<div id="page-purchase" class="page">
  <div class="loading">加载中...</div>
</div>

<div id="page-weight" class="page">
  <div class="loading">加载中...</div>
</div>

<div id="page-todo" class="page">
  <div class="loading">加载中...</div>
</div>

<div class="toast" id="toast"></div>
<div class="footer">Lucaslei 统一应用 · 数据实时同步</div>

<script>
var API_BASE='https://api.lucaslei.cyou';
var loadedPages={};

function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast '+(type||'info');
  el.style.display='block';
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){el.style.display='none'},2500);
}

function switchPage(name){
  // 更新 tab 状态
  document.querySelectorAll('.nav-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.page===name);
  });
  // 切换页面
  document.querySelectorAll('.page').forEach(function(p){
    p.classList.toggle('active', p.id==='page-'+name);
  });
  // 懒加载
  if(!loadedPages[name]){
    loadPage(name);
  }
}

function loadPage(name){
  var container=document.getElementById('page-'+name);
  container.innerHTML='<div class="loading">加载中...</div>';
  
  // 从对应的子域名加载模块
  var urls={
    recipes: 'https://cp.lucaslei.cyou',
    purchase: 'https://zx.lucaslei.cyou',
    weight: 'https://tz.lucaslei.cyou',
    todo: 'https://todo.lucaslei.cyou'
  };
  
  // 用 iframe 嵌入现有页面（最简单的方式，不需要改现有代码）
  var iframe=document.createElement('iframe');
  iframe.className='module-frame';
  iframe.src=urls[name];
  iframe.onload=function(){
    loadedPages[name]=true;
  };
  iframe.onerror=function(){
    container.innerHTML='<div class="loading" style="color:var(--red)">加载失败，请检查网络<br><button class="btn btn-primary" style="margin-top:10px" onclick="loadPage(\''+name+'\')">重试</button></div>';
  };
  container.innerHTML='';
  container.appendChild(iframe);
}

// 默认加载菜谱页
loadedPages.recipes=false;
loadPage('recipes');
</script>
</body>
</html>
